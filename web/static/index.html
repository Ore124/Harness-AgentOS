<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harness AgentOS Console</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f5f1;
      --ink: #141414;
      --muted: #686760;
      --line: #d7d3c8;
      --panel: #ffffff;
      --accent: #255f4f;
      --danger: #a33a2f;
      --code: #1d1f21;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(246, 245, 241, 0.92);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 {
      margin: 0;
      font-size: 19px;
      letter-spacing: 0;
    }
    .status-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 12px;
      color: var(--muted);
      background: #fff;
    }
    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      min-height: calc(100svh - 62px);
    }
    aside {
      border-right: 1px solid var(--line);
      padding: 24px;
      background: #fbfaf7;
    }
    section.workspace {
      padding: 24px;
      min-width: 0;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 12px;
      outline: none;
    }
    textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.45;
    }
    textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 95, 79, 0.12);
    }
    .field { margin-bottom: 18px; }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      padding: 10px 13px;
      cursor: pointer;
      transition: transform 140ms ease, opacity 140ms ease;
    }
    button.secondary {
      background: #e5e1d6;
      color: var(--ink);
    }
    button.danger {
      background: var(--danger);
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
      gap: 24px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .panel h2 {
      margin: 0;
      padding: 14px 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--line);
    }
    .panel-body { padding: 16px; }
    .timeline {
      display: grid;
      grid-template-columns: repeat(6, minmax(78px, 1fr));
      gap: 8px;
    }
    .step {
      border-bottom: 3px solid var(--line);
      padding-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
      transition: color 160ms ease, border-color 160ms ease;
    }
    .step.active {
      color: var(--ink);
      border-color: var(--accent);
      font-weight: 700;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--code);
      color: #f1efe6;
      border-radius: 8px;
      padding: 14px;
      max-height: 430px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
    }
    .trace-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    .trace-item:last-child { border-bottom: 0; }
    .trace-meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }
    .artifact a {
      display: block;
      color: var(--accent);
      text-decoration: none;
      padding: 7px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    .recommendation {
      display: none;
      border: 1px solid #d9c78b;
      background: #fff8dc;
      border-radius: 8px;
      padding: 14px;
      margin-top: 18px;
    }
    .recommendation.visible { display: block; }
    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    @media (max-width: 920px) {
      main, .layout { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .timeline { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Harness AgentOS Console</h1>
    <div class="status-pill" id="connection">Idle</div>
  </header>
  <main>
    <aside>
      <div class="field">
        <label for="prompt">Function to build or task to solve</label>
        <textarea id="prompt" placeholder="Build a browser-based kanban board with drag and drop, local persistence, and a compact analytics view."></textarea>
      </div>
      <div class="field">
        <label for="profile">Profile</label>
        <select id="profile">
          <option value="auto">Auto route</option>
          <option value="app-builder">app-builder</option>
          <option value="terminal">terminal</option>
          <option value="swe-bench">swe-bench</option>
          <option value="reasoning">reasoning</option>
        </select>
      </div>
      <div class="actions">
        <button id="start">Run</button>
        <button class="secondary" id="resume" disabled>Resume</button>
        <button class="danger" id="pause" disabled>Pause</button>
      </div>
      <div class="recommendation" id="recommendation">
        <strong>Profile confirmation required</strong>
        <p class="small" id="routeReason"></p>
        <div class="actions" id="profileChoices"></div>
      </div>
    </aside>
    <section class="workspace">
      <div class="layout">
        <div>
          <div class="panel">
            <h2>Run timeline</h2>
            <div class="panel-body">
              <div class="timeline" id="timeline"></div>
            </div>
          </div>
          <div class="panel">
            <h2>Agent activity</h2>
            <div class="panel-body" id="trace"></div>
          </div>
        </div>
        <div>
          <div class="panel">
            <h2>State</h2>
            <div class="panel-body"><pre id="state">{}</pre></div>
          </div>
          <div class="panel">
            <h2>Artifacts</h2>
            <div class="panel-body artifact" id="artifacts"><span class="small">No artifacts yet.</span></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const phases = ["route", "plan", "contract", "build", "evaluate", "analyze"];
    let currentRun = null;
    let source = null;

    const qs = (id) => document.getElementById(id);

    qs("timeline").innerHTML = phases.map(p => `<div class="step" data-phase="${p}">${p}</div>`).join("");

    qs("start").addEventListener("click", async () => {
      const prompt = qs("prompt").value.trim();
      if (!prompt) return;
      const res = await fetch("/api/runs", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({prompt, profile: qs("profile").value})
      });
      const state = await res.json();
      currentRun = state.run_id;
      attachEvents(currentRun);
      renderState(state, []);
    });

    qs("pause").addEventListener("click", async () => {
      if (!currentRun) return;
      const state = await post(`/api/runs/${currentRun}/pause`);
      renderState(state, []);
    });

    qs("resume").addEventListener("click", async () => {
      if (!currentRun) return;
      const state = await post(`/api/runs/${currentRun}/resume`);
      renderState(state, []);
      attachEvents(currentRun);
    });

    async function post(url, body = {}) {
      const res = await fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      return await res.json();
    }

    function attachEvents(runId) {
      if (source) source.close();
      source = new EventSource(`/api/runs/${runId}/events`);
      qs("connection").textContent = `Watching ${runId}`;
      source.addEventListener("update", (event) => {
        const payload = JSON.parse(event.data);
        renderState(payload.state, payload.trace || []);
      });
      source.addEventListener("error", () => {
        qs("connection").textContent = "Reconnecting";
      });
    }

    function renderState(state, trace) {
      currentRun = state.run_id;
      qs("state").textContent = JSON.stringify({
        run_id: state.run_id,
        profile: state.profile,
        status: state.status,
        active: state.active,
        phase: state.phase,
        next_action: state.next_action,
        round_num: state.round_num,
        score_history: state.score_history,
        last_error: state.last_error,
        route_decision: state.route_decision
      }, null, 2);

      document.querySelectorAll(".step").forEach(el => {
        el.classList.toggle("active", el.dataset.phase === state.phase || el.dataset.phase === state.next_action);
      });
      qs("pause").disabled = !state.active;
      qs("resume").disabled = state.active || state.status === "completed";
      renderRecommendation(state);
      renderTrace(trace);
      renderArtifacts(state);
    }

    function renderRecommendation(state) {
      const box = qs("recommendation");
      const decision = state.route_decision;
      if (!state.requires_confirmation || !decision) {
        box.classList.remove("visible");
        return;
      }
      box.classList.add("visible");
      qs("routeReason").textContent = decision.reasoning || "Confidence is too low to execute automatically.";
      qs("profileChoices").innerHTML = (decision.alternatives || []).map(item => {
        return `<button class="secondary" data-profile="${item.profile}">${item.profile} ${(item.confidence * 100).toFixed(0)}%</button>`;
      }).join("");
      qs("profileChoices").querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", async () => {
          const state = await post(`/api/runs/${currentRun}/confirm-profile`, {profile: btn.dataset.profile});
          renderState(state, []);
          attachEvents(currentRun);
        });
      });
    }

    function renderTrace(trace) {
      if (!trace.length) {
        qs("trace").innerHTML = '<span class="small">No agent trace yet.</span>';
        return;
      }
      qs("trace").innerHTML = trace.slice(-80).reverse().map(event => {
        const title = `${event.agent || "scheduler"} · ${event.event || event.type || "event"} · ${event._file || ""}`;
        const body = event.tool ? `${event.tool}: ${event.result || ""}` : (event.content || event.message || event.reason || JSON.stringify(event).slice(0, 300));
        return `<div class="trace-item"><div class="trace-meta">${escapeHtml(title)}</div>${escapeHtml(String(body).slice(0, 800))}</div>`;
      }).join("");
    }

    function renderArtifacts(state) {
      const files = state.artifacts && state.artifacts.files ? state.artifacts.files : [];
      if (!files.length) {
        qs("artifacts").innerHTML = '<span class="small">No artifacts yet.</span>';
        return;
      }
      qs("artifacts").innerHTML = files.map(file => {
        return `<a href="/api/runs/${state.run_id}/artifact/${encodeURIComponent(file.name)}" target="_blank">${escapeHtml(file.name)} · ${file.size} bytes</a>`;
      }).join("");
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[ch]));
    }
  </script>
</body>
</html>
