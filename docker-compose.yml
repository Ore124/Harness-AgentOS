services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: harness
      MINIO_ROOT_PASSWORD: harness-dev-only
    volumes:
      - artifact-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 harness harness-dev-only; do sleep 2; done;
        mc mb --ignore-existing local/harness-artifacts

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      HARNESS_DATABASE_URL: postgresql+psycopg://harness:harness-dev-only@postgres:5432/harness
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command:
      - python
      - -c
      - from web.server import run_server; run_server(host='0.0.0.0', port=8765)
    env_file:
      - path: .env
        required: false
    environment:
      HARNESS_RUNTIME: durable
      HARNESS_DATABASE_URL: postgresql+psycopg://harness:harness-dev-only@postgres:5432/harness
      HARNESS_ARTIFACT_STORE: s3
      HARNESS_S3_BUCKET: harness-artifacts
      HARNESS_S3_ENDPOINT_URL: http://minio:9000
      HARNESS_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: harness
      AWS_SECRET_ACCESS_KEY: harness-dev-only
    ports:
      - "8765:8765"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - workspace-data:/opt/harness/workspace

  worker:
    build: .
    command: ["python", "harness.py", "--worker"]
    env_file:
      - path: .env
        required: false
    environment:
      HARNESS_RUNTIME: durable
      HARNESS_DATABASE_URL: postgresql+psycopg://harness:harness-dev-only@postgres:5432/harness
      HARNESS_EXECUTION_CAPABILITY: local
      HARNESS_WORKER_CAPABILITIES: local
      HARNESS_WORKER_EXECUTOR: local
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - workspace-data:/opt/harness/workspace

volumes:
  postgres-data:
  artifact-data:
  workspace-data:
